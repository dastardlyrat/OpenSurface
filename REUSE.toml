version = 1

[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  "AUTHORS.md",
  "LICENSE",
  "LICENSES/*.txt",
  "LICENSING.md",
  "PUBLISHING.md",
  "README.md",
  "SOURCE_MANIFEST.sha256",
  "THIRD_PARTY_NOTICES.md",
  "Camera Obscura/README.md",
  "Camera Obscura/External Image Denoiser/**",
  "Camera Obscura/Stabilized Detail Cache/**",
  "Camera Obscura/Lazara Color Revival/**",
  "docs/**",
  "tools/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 dastardlyrat and OpenSurface contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "Camera Obscura/Guided Detail/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 OpenSurface Camera Obscura contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "Camera Obscura/Lazara Color Revival/docs/images/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 dastardlyrat"
SPDX-License-Identifier = "LicenseRef-Documentation-Screenshot"

[[annotations]]
path = "Camera Obscura/Guided Detail/docs/images/*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 dastardlyrat"
SPDX-License-Identifier = "LicenseRef-Documentation-Screenshot"
